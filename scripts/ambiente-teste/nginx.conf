# Faz o papel do Kong da produção: mesmos caminhos que o supabase-js usa.
map $http_upgrade $conexao {
  default upgrade;
  ''      close;
}

server {
  listen 8000;
  client_max_body_size 20m;

  # O GoTrue recusa no preflight cabeçalhos que o supabase-js manda; na produção o
  # plugin de CORS do Kong responde por ele
  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
      add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  location /realtime/v1/api/ {
    proxy_pass http://realtime:4000/api/;
    proxy_set_header Host realtime-dev;
  }

  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexao;
    proxy_set_header Host realtime-dev;
    proxy_read_timeout 3600s;
  }
}
