# Ambiente de teste do VittaDesk: Supabase descartável (sem storage) na VPS.
# Mesmas versões da produção. Rede interna sem saída para a internet; só o
# gateway publica, e só em 127.0.0.1 da VPS (acesso por túnel SSH).
# Sobe com scripts/ambiente-teste/remoto.sh, que gera o .env com os segredos.

name: ci-ambiente-teste

networks:
  interna:
    internal: true
  saida:

volumes:
  dados:

services:
  db:
    image: supabase/postgres:15.8.1.085
    container_name: ci-ambiente-teste-db
    environment:
      POSTGRES_PASSWORD: ${SENHA_BANCO}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: "3600"
    volumes:
      - dados:/var/lib/postgresql/data
    networks: [interna]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 3s
      retries: 60

  auth:
    image: supabase/gotrue:v2.186.0
    container_name: ci-ambiente-teste-auth
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SENHA_BANCO}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000,http://localhost:3001
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    networks: [interna]
    mem_limit: 256m

  rest:
    image: postgrest/postgrest:v14.6
    container_name: ci-ambiente-teste-rest
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${SENHA_BANCO}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    networks: [interna]
    mem_limit: 256m

  realtime:
    image: supabase/realtime:v2.76.5
    container_name: ci-ambiente-teste-realtime
    # O Realtime acha o inquilino pelo primeiro rótulo do Host: realtime-dev,
    # o mesmo que SEED_SELF_HOST cria.
    hostname: realtime-dev
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${SENHA_BANCO}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${CHAVE_REALTIME}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks: [interna]
    mem_limit: 512m

  gateway:
    image: nginx:1.27-alpine
    container_name: ci-ambiente-teste-gateway
    depends_on: [auth, rest, realtime]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:54321:8000"
    networks: [interna, saida]
    mem_limit: 64m
